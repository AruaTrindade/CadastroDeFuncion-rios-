<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header">
            <h4 class="mb-0" th:text="${titulo}">Formulário</h4>
        </div>
        <div class="card-body">

            <form th:object="${funcionario}"
                  method="post"
                  th:action="@{${funcionario.id == null} ? '/funcionarios/ui/criar' : '/funcionarios/ui/alterar/' + ${funcionario.id}}">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{name}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Idade</label>
                    <input type="number" class="form-control" th:field="*{idade}" required min="1">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">URL da Imagem</label>
                    <input type="url" class="form-control" th:field="*{imgUrl}" placeholder="https://...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Departamento</label>
                    <select class="form-select" name="departamentos.id" required>
                        <option value="">Selecione um departamento</option>
                        <option th:each="dep : ${departamentos}"
                                th:value="${dep.id}"
                                th:text="${dep.nomeDoDepartamento}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/funcionarios/ui/listar}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${funcionario.id == null} ? 'Cadastrar' : 'Atualizar'">Salvar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
