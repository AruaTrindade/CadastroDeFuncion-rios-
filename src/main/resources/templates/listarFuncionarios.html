<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Funcionários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista de Funcionários</h1>
        <a th:href="@{/funcionarios/ui/criar}" class="btn btn-success">+ Novo Funcionário</a>
    </div>

    <!-- Mensagens de feedback -->
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Imagem</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Email</th>
                    <th>Departamento</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="funcionario : ${funcionarios}">
                    <td th:text="${funcionario.id}"></td>

                    <td>
                        <img th:if="${funcionario.imgUrl != null and !#strings.isEmpty(funcionario.imgUrl)}"
                             th:src="${funcionario.imgUrl}"
                             alt="Foto"
                             width="50" height="50"
                             class="rounded-circle object-fit-cover">
                        <span th:unless="${funcionario.imgUrl != null and !#strings.isEmpty(funcionario.imgUrl)}"
                              class="text-muted">Sem foto</span>
                    </td>

                    <td th:text="${funcionario.name}"></td>
                    <td th:text="${funcionario.idade}"></td>
                    <td th:text="${funcionario.email}"></td>

                    <!-- Departamento -->
                    <td th:text="${funcionario.departamentos != null ? funcionario.departamentos.nomeDoDepartamento : 'Sem departamento'}"></td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/funcionarios/ui/detalhes/{id}(id=${funcionario.id})}"
                               class="btn btn-outline-primary">Detalhes</a>

                            <a th:href="@{/funcionarios/ui/alterar/{id}(id=${funcionario.id})}"
                               class="btn btn-outline-warning">Editar</a>

                            <form th:action="@{/funcionarios/ui/deletar/{id}(id=${funcionario.id})}"
                                  method="post"
                                  style="display:inline"
                                  onsubmit="return confirm('Tem certeza que deseja deletar este funcionário?');">
                                <button type="submit" class="btn btn-outline-danger">Deletar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(funcionarios)}">
                    <td colspan="7" class="text-center text-muted py-4">Nenhum funcionário cadastrado</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
