<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Detalhes do Funcionário</h4>
        </div>
        <div class="card-body text-center">

            <img th:if="${funcionario.imgUrl != null and !#strings.isEmpty(funcionario.imgUrl)}"
                 th:src="${funcionario.imgUrl}"
                 class="rounded-circle mb-3"
                 width="120" height="120"
                 style="object-fit: cover;">

            <h3 th:text="${funcionario.name}"></h3>
            <p class="text-muted">ID: <span th:text="${funcionario.id}"></span></p>

            <ul class="list-group list-group-flush text-start mt-4">
                <li class="list-group-item">
                    <strong>Idade:</strong>
                    <span th:text="${funcionario.idade}"></span>
                </li>
                <li class="list-group-item">
                    <strong>Email:</strong>
                    <span th:text="${funcionario.email}"></span>
                </li>
                <li class="list-group-item">
                    <strong>Departamento:</strong>
                    <span th:text="${funcionario.departamentos != null ? funcionario.departamentos.nomeDoDepartamento : 'Sem departamento'}"></span>                </li>
            </ul>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a th:href="@{/funcionarios/ui/listar}" class="btn btn-secondary">Voltar</a>
            <div>
                <a th:href="@{/funcionarios/ui/alterar/{id}(id=${funcionario.id})}"
                   class="btn btn-warning">Editar</a>

                <form th:action="@{/funcionarios/ui/deletar/{id}(id=${funcionario.id})}"
                      method="post" style="display:inline"
                      onsubmit="return confirm('Tem certeza?');">
                    <button type="submit" class="btn btn-danger">Deletar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
