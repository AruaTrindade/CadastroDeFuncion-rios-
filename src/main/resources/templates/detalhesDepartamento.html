<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header">
            <h4 class="mb-0" th:text="${titulo}">Formulário</h4>
        </div>
        <div class="card-body">

            <form th:object="${departamento}"
                  method="post"
                  th:action="${departamento.id == null} ? '/departamento/ui/criar' : '/departamento/ui/alterar/' + ${departamento.id}">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nome do Departamento</label>
                    <input type="text" class="form-control" th:field="*{nomeDoDepartamento}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Responsável</label>
                    <input type="text" class="form-control" th:field="*{responsavel}" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/departamento/ui/listar}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${departamento.id == null} ? 'Cadastrar' : 'Atualizar'">Salvar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
