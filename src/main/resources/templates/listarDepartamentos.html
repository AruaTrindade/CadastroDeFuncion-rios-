<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista de Departamentos</h1>
        <a th:href="@{/departamento/ui/criar}" class="btn btn-success">+ Novo Departamento</a>
    </div>

    <!-- Mensagens de feedback -->
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome do Departamento</th>
                    <th>Responsável</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="departamento : ${departamentos}">
                    <td th:text="${departamento.id}"></td>
                    <td th:text="${departamento.nomeDoDepartamento}"></td>
                    <td th:text="${departamento.responsavel}"></td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/departamento/ui/detalhes/{id}(id=${departamento.id})}"
                               class="btn btn-outline-primary">Detalhes</a>

                            <a th:href="@{/departamento/ui/alterar/{id}(id=${departamento.id})}"
                               class="btn btn-outline-warning">Editar</a>

                            <form th:action="@{/departamento/ui/deletar/{id}(id=${departamento.id})}"
                                  method="post"
                                  style="display:inline"
                                  onsubmit="return confirm('Tem certeza que deseja deletar este departamento?');">
                                <button type="submit" class="btn btn-outline-danger">Deletar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departamentos)}">
                    <td colspan="4" class="text-center text-muted py-4">Nenhum departamento cadastrado</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
