<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Departamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Detalhes do Departamento</h4>
        </div>
        <div class="card-body">

            <h3 th:text="${departamento.nomeDoDepartamento}"></h3>
            <p class="text-muted">ID: <span th:text="${departamento.id}"></span></p>

            <ul class="list-group list-group-flush text-start mt-4">
                <li class="list-group-item">
                    <strong>Nome do Departamento:</strong>
                    <span th:text="${departamento.nomeDoDepartamento}"></span>
                </li>
                <li class="list-group-item">
                    <strong>Responsável:</strong>
                    <span th:text="${departamento.responsavel}"></span>
                </li>
            </ul>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <a th:href="@{/departamento/ui/listar}" class="btn btn-secondary">Voltar</a>
            <div>
                <a th:href="@{/departamento/ui/alterar/{id}(id=${departamento.id})}"
                   class="btn btn-warning">Editar</a>

                <form th:action="@{/departamento/ui/deletar/{id}(id=${departamento.id})}"
                      method="post" style="display:inline"
                      onsubmit="return confirm('Tem certeza?');">
                    <button type="submit" class="btn btn-danger">Deletar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
